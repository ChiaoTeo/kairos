[package]
name = "kairos-conflux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Closed, typed, single-writer runtime for Kairos modules"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

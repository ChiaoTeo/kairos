[package]
name = "kairos-conflux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Closed, typed, single-writer runtime for Kairos modules"

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
kairos-account-contract.workspace = true
kairos-execution-contract.workspace = true
kairos-integration.workspace = true
kairos-market-contract.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-reference-contract.workspace = true
kairos-risk-contract.workspace = true
kairos-transport.workspace = true
kairos-workspace.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true

[package]
name = "kairos-conflux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Closed, typed, single-writer runtime for Kairos modules"

[dependencies]
futures-util = "0.3"
kairos-account-contract = { path = "../../modules/account/contract" }
kairos-execution-contract = { path = "../../modules/execution/contract" }
kairos-integration = { path = "../integration" }
kairos-market-contract = { path = "../../modules/market/contract" }
kairos-reference-contract = { path = "../../modules/reference/contract" }
kairos-risk-contract = { path = "../../modules/risk/contract" }
kairos-transport = { path = "../transport" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

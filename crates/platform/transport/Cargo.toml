[package]
name = "kairos-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aeron transport adapters for Kairos"

[dependencies]
# Keep the Rust client and the Aeron C ABI in one release train. The bundled
# precompiled C client avoids requiring a local CMake/Java toolchain and uses
# the same CnC layout as the current Media Driver.
clap.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
rusteron-client.workspace = true
rusteron-media-driver.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "kairos-aeron-driver"
path = "src/bin/kairos-aeron-driver.rs"

[[bin]]
name = "kairos-aeron-bridge"
path = "src/bin/kairos-aeron-bridge.rs"

[dev-dependencies]
tempfile.workspace = true

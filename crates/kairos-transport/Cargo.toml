[package]
name = "kairos-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aeron and shared-memory transport adapters for Kairos"

[dependencies]
aeron = { version = "0.2", default-features = false }
kairos-protocol = { path = "../kairos-protocol" }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

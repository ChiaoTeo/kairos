[package]
name = "kairos-reference"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference catalog application, queries and services"
autobins = false

[lib]
name = "kairos_reference"
path = "src/lib.rs"

[dependencies]
kairos-workspace = { path = "../kairos-workspace" }
aeron = { version = "0.2", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-integration = { path = "../kairos-integration" }
kairos-protocol = { path = "../kairos-protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-reference-server"
path = "src/bin/kairos-reference-server.rs"

[[bin]]
name = "kairos-reference-cli"
path = "src/bin/kairos-reference-cli.rs"

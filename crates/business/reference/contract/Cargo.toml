[package]
name = "kairos-reference-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference module cross-process read and write contract"

[lib]
name = "kairos_reference_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[package]
name = "kairos-reference-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference catalog application, queries and services"
autobins = false

[lib]
name = "kairos_reference"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.8"
kairos-domain-types = { path = "../../../kairos-domain-types" }
kairos-workspace = { path = "../../../kairos-workspace", features = ["otel"] }
kairos-transport = { path = "../../../kairos-transport" }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-integration = { path = "../../../kairos-integration" }
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-reference-contract = { path = "../contract" }
sqlx = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy.workspace = true
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-reference-server"
path = "src/bin/kairos-reference-server.rs"

[[bin]]
name = "kairos-reference-cli"
path = "src/bin/kairos-reference-cli.rs"

[package]
name = "kairos-market-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Market actor, subscription intent and normalized market state"
autobins = false

[lib]
name = "kairos_market"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
kairos-workspace = { path = "../../../kairos-workspace" }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-integration = { path = "../../../kairos-integration" }
kairos-transport = { path = "../../../kairos-transport" }
kairos-market-contract = { path = "../contract" }
kairos-reference-contract = { path = "../../reference/contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-market-server"
path = "src/bin/kairos-market-server.rs"

[[bin]]
name = "kairos-market-cli"
path = "src/bin/kairos-market-cli.rs"

[package]
name = "kairos-execution-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Execution state owner and exchange order boundary"
autobins = false

[lib]
name = "kairos_execution"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
kairos-domain-types = { path = "../../../kairos-domain-types" }
kairos-integration = { path = "../../../kairos-integration" }
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
kairos-execution-contract = { path = "../contract" }
kairos-account-contract = { path = "../../account/contract" }
kairos-market-contract = { path = "../../market/contract" }
kairos-reference-contract = { path = "../../reference/contract" }
kairos-risk-contract = { path = "../../risk/contract" }
clap = { version = "4", features = ["derive", "env"] }
kairos-workspace = { path = "../../../kairos-workspace", features = ["otel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { workspace = true }
toml = "0.8"
sqlx = { workspace = true }
futures-util = { version = "0.3", features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
rust_decimal = { version = "1.42", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rusqlite.workspace = true
rusteron-media-driver = { version = "0.2.4", default-features = false, features = ["static", "precompile-rustls"] }
tempfile = "3"

[[bin]]
name = "kairos-execution-server"
path = "src/bin/kairos-execution-server.rs"

[[bin]]
name = "kairos-execution-cli"
path = "src/bin/kairos-execution-cli.rs"

[[bin]]
name = "kairos-execution-event-bridge"
path = "src/bin/kairos-execution-event-bridge.rs"

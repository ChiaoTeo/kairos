[package]
name = "kairos-account-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Account module cross-process read and write contract"

[lib]
name = "kairos_account_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

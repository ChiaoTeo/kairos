[package]
name = "kairos-account-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Account state owner, reconciliation and account snapshots"
autobins = false

[lib]
name = "kairos_account"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-integration = { path = "../../../kairos-integration" }
kairos-workspace = { path = "../../../kairos-workspace" }
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-account-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.42", default-features = false }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-account-server"
path = "src/bin/kairos-account-server.rs"

[[bin]]
name = "kairos-account-cli"
path = "src/bin/kairos-account-cli.rs"

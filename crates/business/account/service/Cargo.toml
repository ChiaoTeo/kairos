[package]
name = "kairos-account-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Account state owner, reconciliation and account snapshots"
autobins = false

[lib]
name = "kairos_account"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
kairos-domain-types = { path = "../../../kairos-domain-types" }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
futures-util = { version = "0.3", features = ["alloc"] }
kairos-integration = { path = "../../../kairos-integration" }
kairos-workspace = { path = "../../../kairos-workspace", features = ["otel"] }
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
kairos-account-contract = { path = "../contract" }
kairos-reference-contract = { path = "../../reference/contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { workspace = true }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
rusteron-media-driver = { version = "0.2.4", default-features = false, features = ["static", "precompile-rustls"] }
tempfile = "3"

[[bin]]
name = "kairos-account-server"
path = "src/bin/kairos-account-server.rs"

[[bin]]
name = "kairos-account-cli"
path = "src/bin/kairos-account-cli.rs"

[[bin]]
name = "kairos-account-event-bridge"
path = "src/bin/kairos-account-event-bridge.rs"

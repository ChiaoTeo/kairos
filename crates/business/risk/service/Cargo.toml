[package]
name = "kairos-risk-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Risk budget and reservation state owner"
autobins = false

[lib]
name = "kairos_risk"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
kairos-domain-types = { path = "../../../kairos-domain-types" }
kairos-workspace = { path = "../../../kairos-workspace", features = ["otel"] }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-risk-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.42", default-features = false }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-risk-server"
path = "src/bin/kairos-risk-server.rs"

[[bin]]
name = "kairos-risk-cli"
path = "src/bin/kairos-risk-cli.rs"

[package]
name = "kairos-risk-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Risk module cross-process read and write contract"

[lib]
name = "kairos_risk_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

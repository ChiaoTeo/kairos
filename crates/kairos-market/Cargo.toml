[package]
name = "kairos-market"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Market actor, subscription intent and normalized market state"
autobins = false

[dependencies]
kairos-workspace = { path = "../kairos-workspace" }
aeron = { version = "0.2", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-protocol = { path = "../kairos-protocol" }
kairos-integration = { path = "../kairos-integration" }
kairos-transport = { path = "../kairos-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-market-server"
path = "src/bin/kairos-market-server.rs"

[[bin]]
name = "kairos-market-cli"
path = "src/bin/kairos-market-cli.rs"

[package]
name = "kairos-account"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Account state owner, reconciliation and account snapshots"
autobins = false

[lib]
name = "kairos_account"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
flatbuffers.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
kairos-account-contract.workspace = true
kairos-conflux.workspace = true
kairos-credentials.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-reference-contract.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
secrecy.workspace = true
serde.workspace = true
jsonrpsee.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rusteron-media-driver.workspace = true
tempfile.workspace = true

[[bin]]
name = "kairos-account-server"
path = "src/bin/kairos-account-server.rs"

[[bin]]
name = "kairos-account-cli"
path = "src/bin/kairos-account-cli.rs"

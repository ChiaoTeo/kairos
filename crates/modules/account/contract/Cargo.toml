[package]
name = "kairos-account-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Account module cross-process read and write contract"

[lib]
name = "kairos_account_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../platform/protocol" }
kairos-transport = { path = "../../../platform/transport" }
kairos-workspace = { path = "../../../platform/workspace" }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"

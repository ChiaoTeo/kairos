[package]
name = "kairos-capital"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Strategy-scoped capital objective and placement state owner"
autobins = false

[lib]
name = "kairos_capital"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
flatbuffers.workspace = true
kairos-account-contract.workspace = true
kairos-capital-contract.workspace = true
kairos-conflux.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-risk-contract.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "kairos-capital-server"
path = "src/bin/kairos-capital-server.rs"

[[bin]]
name = "kairos-capital-cli"
path = "src/bin/kairos-capital-cli.rs"

[package]
name = "kairos-execution-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Execution module cross-process read and write contract"

[lib]
name = "kairos_execution_contract"
path = "src/lib.rs"

[dependencies]
kairos-protocol = { path = "../../../kairos-protocol" }
kairos-transport = { path = "../../../kairos-transport" }
reqwest = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flatbuffers = "25.12.19"
kairos-workspace = { path = "../../../kairos-workspace" }
futures-core = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

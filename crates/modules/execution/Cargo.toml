[package]
name = "kairos-execution"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Execution state owner and exchange order boundary"
autobins = false

[lib]
name = "kairos_execution"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
flatbuffers = "25.12.19"
kairos-primitives = { path = "../../primitives" }
kairos-integration = { path = "../../platform/integration" }
kairos-protocol = { path = "../../platform/protocol" }
kairos-transport = { path = "../../platform/transport" }
kairos-execution-contract = { path = "contract" }
kairos-account-contract = { path = "../account/contract" }
kairos-market-contract = { path = "../market/contract" }
kairos-reference-contract = { path = "../reference/contract" }
kairos-risk-contract = { path = "../risk/contract" }
clap = { version = "4", features = ["derive", "env"] }
kairos-workspace = { path = "../../platform/workspace", features = ["otel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { workspace = true }
toml = "0.8"
sqlx = { workspace = true, features = ["macros", "migrate"] }
futures-util = { version = "0.3", features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
rust_decimal = { version = "1.42", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-execution-server"
path = "src/bin/kairos-execution-server.rs"

[[bin]]
name = "kairos-execution-cli"
path = "src/bin/kairos-execution-cli.rs"

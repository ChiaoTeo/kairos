[package]
name = "kairos-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Execution state owner and exchange order boundary"
autobins = false

[lib]
name = "kairos_execution"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
flatbuffers.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
kairos-account-contract.workspace = true
kairos-conflux.workspace = true
kairos-credentials.workspace = true
kairos-execution-contract.workspace = true
kairos-market-contract.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-reference-contract.workspace = true
kairos-risk-contract.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
jsonrpsee.workspace = true
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true

[[bin]]
name = "kairos-execution-server"
path = "src/bin/kairos-execution-server.rs"

[[bin]]
name = "kairos-execution-cli"
path = "src/bin/kairos-execution-cli.rs"

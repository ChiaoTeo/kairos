[package]
name = "kairos-reference"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference catalog application, queries and services"
autobins = false

[lib]
name = "kairos_reference"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.8"
kairos-primitives = { path = "../../primitives" }
kairos-workspace = { path = "../../platform/workspace", features = ["otel"] }
kairos-transport = { path = "../../platform/transport" }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
futures-util = "0.3"
kairos-integration = { path = "../../platform/integration" }
kairos-protocol = { path = "../../platform/protocol" }
kairos-reference-contract = { path = "contract" }
sqlx = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy.workspace = true
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kairos-reference-server"
path = "src/bin/kairos-reference-server.rs"

[[bin]]
name = "kairos-reference-cli"
path = "src/bin/kairos-reference-cli.rs"

[[bin]]
name = "kairos-reference-event-cli"
path = "src/bin/kairos-reference-event-cli.rs"

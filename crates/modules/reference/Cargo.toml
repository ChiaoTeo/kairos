[package]
name = "kairos-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference catalog application, queries and services"
autobins = false

[lib]
name = "kairos_reference"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
kairos-conflux.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-reference-contract.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
jsonrpsee.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[[bin]]
name = "kairos-reference-server"
path = "src/bin/kairos-reference-server.rs"

[[bin]]
name = "kairos-reference-cli"
path = "src/bin/kairos-reference-cli.rs"

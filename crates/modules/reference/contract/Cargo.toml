[package]
name = "kairos-reference-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference module cross-process read and write contract"

[lib]
name = "kairos_reference_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../../platform/protocol" }
kairos-primitives = { path = "../../../primitives" }
kairos-transport = { path = "../../../platform/transport" }
kairos-workspace = { path = "../../../platform/workspace" }
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures-core = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"

[dev-dependencies]
rusteron-media-driver = { version = "0.2.4", default-features = false, features = ["static", "precompile-rustls"] }
tempfile = "3"

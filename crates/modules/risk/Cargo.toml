[package]
name = "kairos-risk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Risk budget and reservation state owner"
autobins = false

[lib]
name = "kairos_risk"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
flatbuffers.workspace = true
kairos-conflux.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-risk-contract.workspace = true
kairos-transport.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "kairos-risk-server"
path = "src/bin/kairos-risk-server.rs"

[[bin]]
name = "kairos-risk-cli"
path = "src/bin/kairos-risk-cli.rs"

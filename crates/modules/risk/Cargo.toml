[package]
name = "kairos-risk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Risk budget and reservation state owner"
autobins = false

[lib]
name = "kairos_risk"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
kairos-primitives = { path = "../../primitives" }
kairos-workspace = { path = "../../platform/workspace", features = ["otel"] }
clap = { version = "4", features = ["derive", "env"] }
flatbuffers = "25.12.19"
kairos-protocol = { path = "../../platform/protocol" }
kairos-risk-contract = { path = "contract" }
kairos-transport = { path = "../../platform/transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.42", default-features = false }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
rusteron-media-driver = { version = "0.2.4", default-features = false, features = ["static", "precompile-rustls"] }
tempfile = "3"

[[bin]]
name = "kairos-risk-server"
path = "src/bin/kairos-risk-server.rs"

[[bin]]
name = "kairos-risk-cli"
path = "src/bin/kairos-risk-cli.rs"

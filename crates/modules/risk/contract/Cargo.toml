[package]
name = "kairos-risk-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Risk module cross-process read and write contract"

[lib]
name = "kairos_risk_contract"
path = "src/lib.rs"

[dependencies]
flatbuffers.workspace = true
futures-core.workspace = true
kairos-primitives.workspace = true
kairos-indexed-view.workspace = true
kairos-protocol.workspace = true
kairos-transport.workspace = true
kairos-workspace.workspace = true
jsonrpsee.workspace = true
reqwest = { workspace = true, features = ["blocking", "gzip", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream.workspace = true

[dev-dependencies]
tempfile.workspace = true

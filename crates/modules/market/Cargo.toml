[package]
name = "kairos-market"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Market actor, subscription intent and normalized market state"
autobins = false

[lib]
name = "kairos_market"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
flatbuffers.workspace = true
futures-util.workspace = true
kairos-conflux.workspace = true
kairos-market-contract.workspace = true
kairos-primitives.workspace = true
kairos-protocol.workspace = true
kairos-reference-contract.workspace = true
kairos-workspace = { workspace = true, features = ["otel"] }
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "orderbook"
harness = false

[[bin]]
name = "kairos-market-server"
path = "src/bin/kairos-market-server.rs"

[[bin]]
name = "kairos-market-cli"
path = "src/bin/kairos-market-cli.rs"

[package]
name = "kairos-primitives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared, infrastructure-free primitive value objects"

[dependencies]
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = "1"

[package]
name = "kairos-workspace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic workspace resources, process lifecycle and control transport"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "signal", "time"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

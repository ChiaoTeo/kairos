[project]
name = "kairospy"
version = "0.1.0"
description = "Strategy runtime, execution, account, reference, and integration toolkit"
requires-python = ">=3.11"
dependencies = ["pandas>=2,<4", "pyarrow>=22,<26", "typer>=0.12,<1"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "pandas>=2,<4", "matplotlib>=3.8,<4", "mplfinance>=0.12.10b0,<1"]
massive = []
data = []
query = ["duckdb>=1.3,<2", "polars>=1.30,<2"]
crypto = ["ccxt>=4,<5"]
tui = ["rich>=13,<15"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
kairospy = "kairospy.__main__:main"
kairos = "kairospy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kairospy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

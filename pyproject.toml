[project]
name = "kairospy"
version = "0.2.0"
description = "Strategy orchestration, execution, account, reference, and integration toolkit"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "apprise>=1.12,<2",
    "click>=8,<9",
    "jmespath>=1.0,<2",
    "prettytable>=3,<4",
    "textual>=8,<9",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "pandas>=2,<4", "matplotlib>=3.8,<4", "mplfinance>=0.12.10b0,<1"]
massive = ["websockets>=12,<16"]
ibkr = ["ib_async>=2,<3"]
data = ["pandas>=2,<4", "pyarrow>=22,<26"]
query = ["duckdb>=1.3,<2", "polars>=1.30,<2"]
crypto-realtime = ["websockets>=12,<16", "python-socks[asyncio]>=2,<3"]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp>=1.30,<2",
    "opentelemetry-instrumentation-aiohttp-client>=0.51b0,<1",
    "opentelemetry-instrumentation-logging>=0.51b0,<1",
]
agent = ["openai-agents[any-llm]>=0.7,<1"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
    "textual-dev>=1.8,<2",
    "pytest-textual-snapshot>=1.1,<2",
    "tui-test==0.1.0b2",
]

[project.scripts]
kairospy = "kairospy.__main__:main"
kairos = "kairospy.__main__:main"
kairospy-strategy = "kairospy.bin.strategy_cli:main"
kairospy-strategy-cli = "kairospy.bin.strategy_cli:main"
kairospy-strategy-server = "kairospy.bin.strategy:main"

[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.11", "wheel>=0.43"]
build-backend = "backend"
backend-path = ["."]

[tool.setuptools.packages.find]
include = ["kairospy*"]

[tool.setuptools]
py-modules = ["backend"]

[tool.setuptools.package-data]
kairospy = [
    "_bin/**/*",
    "surface/workbench/styles/*.tcss",
    "system/apps/workspace/template_assets/**/*",
]

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_transport"
path = "crates/platform/python-transport/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_account_contract"
path = "crates/modules/account/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_capital_contract"
path = "crates/modules/capital/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_execution_contract"
path = "crates/modules/execution/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_market_contract"
path = "crates/modules/market/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_reference_contract"
path = "crates/modules/reference/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[[tool.setuptools-rust.ext-modules]]
target = "kairospy._native_risk_contract"
path = "crates/modules/risk/contract/py/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not rust_interop'"
markers = [
    "rust_interop: cross-language acceptance tests that build Rust fixture executables",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9"]

[tool.pyright]
include = ["kairospy", "examples", "tests/public_api"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
# Public facades intentionally use module-level __getattr__ for lazy imports.
reportUnsupportedDunderAll = "none"

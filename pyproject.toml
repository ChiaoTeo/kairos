[project]
name = "kairospy"
version = "0.1.0"
description = "Strategy orchestration, execution, account, reference, and integration toolkit"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "click>=8,<9",
    "flatbuffers>=25,<26",
    "jmespath>=1.0,<2",
    "prettytable>=3,<4",
    "prompt-toolkit>=3,<4",
    "textual>=8,<9",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "pandas>=2,<4", "matplotlib>=3.8,<4", "mplfinance>=0.12.10b0,<1"]
massive = ["websockets>=12,<16"]
ibkr = ["ib_async>=2,<3"]
data = ["pandas>=2,<4", "pyarrow>=22,<26"]
query = ["duckdb>=1.3,<2", "polars>=1.30,<2"]
crypto-realtime = ["websockets>=12,<16", "python-socks[asyncio]>=2,<3"]
tui = ["rich>=13,<15"]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp>=1.30,<2",
    "opentelemetry-instrumentation-aiohttp-client>=0.51b0,<1",
    "opentelemetry-instrumentation-logging>=0.51b0,<1",
]

[dependency-groups]
dev = ["hypothesis>=6,<7", "pytest>=8,<9", "ruff>=0.12,<1", "pyright>=1.1.400,<2"]

[project.scripts]
kairospy = "kairospy.__main__:main"
kairos = "kairospy.__main__:main"
kairospy-strategy = "kairospy.bin.strategy_cli:main"
kairospy-strategy-cli = "kairospy.bin.strategy_cli:main"
kairospy-strategy-server = "kairospy.bin.strategy:main"

[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "backend"
backend-path = ["."]

[tool.setuptools.packages.find]
include = ["kairospy*"]

[tool.setuptools]
py-modules = ["backend"]

[tool.setuptools.package-data]
kairospy = ["_bin/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["kairospy/infrastructure/transport/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9"]

[tool.pyright]
include = ["kairospy", "examples", "tests/public_api"]
exclude = ["**/__pycache__", "kairospy/infrastructure/transport/generated"]
ignore = ["kairospy/infrastructure/transport/generated"]
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/platform/integration",
    "crates/platform/network",
    "crates/platform/protocol",
    "crates/platform/transport",
    "crates/platform/python-transport",
    "crates/platform/workspace",
    "crates/modules/account",
    "crates/modules/account/contract",
    "crates/modules/execution",
    "crates/modules/execution/contract",
    "crates/modules/market",
    "crates/modules/market/contract",
    "crates/modules/reference",
    "crates/modules/reference/contract",
    "crates/modules/risk",
    "crates/modules/risk/contract",
]

[workspace.dependencies]
criterion = "0.8"
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
proptest = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "gzip", "rustls"] }
rusqlite = { version = "0.39", default-features = false }
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
tracing-opentelemetry = "0.32"

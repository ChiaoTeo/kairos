openapi: 3.1.0
info:
  title: Kairos Risk Control API
  version: 2.0.0
  description: >-
    User-facing Risk authorization and reservation API over a workspace-scoped
    Unix domain socket carrying HTTP semantics. Authorization is synchronous:
    a successful response is the authoritative decision and reservation.
    Reservation cleanup is idempotent. Risk facts are also published on the
    Risk event stream and the latest policy/reservation view is available via
    mmap.
servers:
  - url: unix://{socket}
    variables:
      socket:
        default: risk.sock
tags:
  - name: authorization
  - name: reservations
  - name: health
paths:
  /v1/authorizations:
    post:
      tags: [authorization]
      operationId: authorizeAndReserve
      summary: Authorize a request and atomically reserve capacity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizeAndReserveRequest'}
      responses:
        '200':
          description: The authoritative risk decision and reservation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizeAndReserveResponse'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/CommandRejected'}
        '503': {$ref: '#/components/responses/ControlUnavailable'}

  /v1/reservations/{reservation_id}/consume:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: consumeReservation
      summary: Consume an active reservation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CleanupRequest'}
      responses:
        '200':
          description: The idempotent cleanup result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationCleanupResponse'}
        '422': {$ref: '#/components/responses/CommandRejected'}

  /v1/reservations/{reservation_id}/release:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [reservations]
      operationId: releaseReservation
      summary: Release an active reservation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CleanupRequest'}
      responses:
        '200':
          description: The idempotent cleanup result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationCleanupResponse'}
        '422': {$ref: '#/components/responses/CommandRejected'}

  /v1/health:
    get:
      tags: [health]
      operationId: getRiskHealth
      summary: Read Risk process health
      responses:
        '200':
          description: Risk operational health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskHealth'}

components:
  parameters:
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    IdempotencyConflict:
      $ref: '../common/control.openapi.yaml#/components/responses/IdempotencyConflict'
    CommandRejected:
      $ref: '../common/control.openapi.yaml#/components/responses/CommandRejected'
    ControlUnavailable:
      $ref: '../common/control.openapi.yaml#/components/responses/ControlUnavailable'
  schemas:
    CommandEnvelope:
      $ref: '../common/control.openapi.yaml#/components/schemas/CommandEnvelope'
    AuthorizeAndReserveRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          required: [request_id, reservation_id, account_id, strategy_id, instrument_id, usages, context]
          properties:
            request_id: {type: string, minLength: 1}
            reservation_id: {type: string, minLength: 1}
            account_id: {type: string, minLength: 1}
            strategy_id: {type: string, minLength: 1}
            instrument_id: {type: string, minLength: 1}
            exchange_id: {type: string, minLength: 1}
            reservation_ttl_nanos: {type: integer, minimum: 1}
            usages:
              type: array
              minItems: 1
              maxItems: 64
              items: {$ref: '#/components/schemas/RiskUsage'}
            context: {$ref: '#/components/schemas/RiskContext'}
    RiskUsage:
      type: object
      required: [metric, amount]
      properties:
        metric: {type: string, minLength: 1}
        amount: {type: string, minLength: 1}
    RiskContext:
      type: object
      required: [current_exposure, current_margin, available_margin, current_pnl, current_drawdown, stress_loss]
      properties:
        evidence:
          type: array
          items: {type: object, additionalProperties: true}
        current_exposure: {type: string, minLength: 1}
        current_margin: {type: string, minLength: 1}
        available_margin: {type: string, minLength: 1}
        current_pnl: {type: string, minLength: 1}
        current_drawdown: {type: string, minLength: 1}
        market_freshness: {type: string, enum: [fresh, stale, unknown]}
        leverage_bps: {type: integer, minimum: 0}
        price_deviation_bps: {type: integer, minimum: 0}
        stress_loss: {type: string, minLength: 1}
    AuthorizeAndReserveResponse:
      type: object
      required: [command_id, decision_id, request_id, outcome, reasons, allocations]
      properties:
        command_id: {type: string, minLength: 1}
        decision_id: {type: string, minLength: 1}
        request_id: {type: string, minLength: 1}
        outcome: {type: string, enum: [allowed, degraded_allowed, rejected]}
        reasons:
          type: array
          items: {type: object, additionalProperties: true}
        allocations:
          type: array
          maxItems: 256
          items: {type: object, additionalProperties: true}
        reservation: {type: object, additionalProperties: true}
        policy_version: {type: integer, minimum: 0}
    CleanupRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          properties:
            reason: {type: string}
    ReservationCleanupResponse:
      type: object
      required: [command_id, reservation_id, outcome]
      properties:
        command_id: {type: string, minLength: 1}
        reservation_id: {type: string, minLength: 1}
        outcome: {type: string, enum: [applied, already_terminal, not_found, rejected]}
        reservation: {type: object, additionalProperties: true}
        reason: {type: string}
    RiskHealth:
      allOf:
        - $ref: '../common/control.openapi.yaml#/components/schemas/HealthResponse'
        - type: object
          properties:
            policy_version: {type: integer, minimum: 0}
            active_reservations: {type: integer, minimum: 0}
    ErrorResponse:
      $ref: '../common/control.openapi.yaml#/components/schemas/ErrorResponse'

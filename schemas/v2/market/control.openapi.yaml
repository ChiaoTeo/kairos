openapi: 3.1.0
info:
  title: Kairos Market Control API
  version: 2.0.0
  description: >-
    User-facing Market control and bounded status API. The transport is a
    workspace-scoped Unix domain socket carrying HTTP semantics. High-rate
    observations are not returned by this API; consumers use the Market event
    stream and current-view mmap resources.
servers:
  - url: unix://{socket}
    variables:
      socket:
        default: market.sock
tags:
  - name: subscriptions
  - name: operations
  - name: health
paths:
  /v1/subscriptions:
    post:
      tags: [subscriptions]
      operationId: subscribeMarket
      summary: Establish a Market subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeMarketRequest'
      responses:
        '201':
          description: The subscription is established and its requested view is readable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/CommandRejected'
        '503':
          $ref: '#/components/responses/ControlUnavailable'

  /v1/subscriptions/{subscription_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [subscriptions]
      operationId: getMarketSubscription
      summary: Read one subscription status
      responses:
        '200':
          description: Current Market-owned subscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [subscriptions]
      operationId: unsubscribeMarket
      summary: Remove a Market subscription
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CallerId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LaunchId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '204':
          description: The subscription was removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/ControlUnavailable'

  /v1/subscriptions/release-owner:
    post:
      tags: [subscriptions]
      operationId: releaseMarketOwner
      summary: Release all subscriptions owned by one caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOwnerRequest'
      responses:
        '200':
          description: All subscriptions owned by the caller were removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCompleted'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/CommandRejected'

  /v1/recovery:
    post:
      tags: [operations]
      operationId: recoverMarket
      summary: Request recovery of Market sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverMarketRequest'
      responses:
        '202':
          description: Recovery was accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '422':
          $ref: '#/components/responses/CommandRejected'

  /v1/health:
    get:
      tags: [health]
      operationId: getMarketHealth
      summary: Read Market process and source health
      responses:
        '200':
          description: Market operational health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHealth'

components:
  parameters:
    CommandId:
      $ref: '../common/control.openapi.yaml#/components/parameters/CommandId'
    IdempotencyKey:
      $ref: '../common/control.openapi.yaml#/components/parameters/IdempotencyKey'
    CallerId:
      $ref: '../common/control.openapi.yaml#/components/parameters/CallerId'
    WorkspaceId:
      $ref: '../common/control.openapi.yaml#/components/parameters/WorkspaceId'
    LaunchId:
      $ref: '../common/control.openapi.yaml#/components/parameters/LaunchId'
    InstanceId:
      $ref: '../common/control.openapi.yaml#/components/parameters/InstanceId'
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    IdempotencyConflict:
      $ref: '../common/control.openapi.yaml#/components/responses/IdempotencyConflict'
    CommandRejected:
      $ref: '../common/control.openapi.yaml#/components/responses/CommandRejected'
    ControlUnavailable:
      $ref: '../common/control.openapi.yaml#/components/responses/ControlUnavailable'
    NotFound:
      $ref: '../common/control.openapi.yaml#/components/responses/NotFound'
  schemas:
    RuntimeScope:
      type: object
      required: [caller_id, workspace_id, market_runtime_id]
      properties:
        caller_id: {type: string, minLength: 1}
        workspace_id: {type: string, minLength: 1}
        market_runtime_id: {type: string, minLength: 1}
        launch_id: {type: string, minLength: 1}
        instance_id: {type: string, minLength: 1}
    CommandEnvelope:
      type: object
      required: [command_id, idempotency_key, scope]
      properties:
        command_id: {type: string, minLength: 1}
        idempotency_key: {type: string, minLength: 1}
        scope: {$ref: '#/components/schemas/RuntimeScope'}
        requested_at_unix_nanos: {type: integer, minimum: 1}
        deadline_unix_nanos: {type: integer, minimum: 1}
    MarketSelector:
      type: string
      minLength: 1
      description: Data kind optionally qualified by a selector, for example bar:1m.
    SubscribeMarketRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          required: [subject, selectors]
          properties:
            subject: {type: string, minLength: 1}
            selectors:
              type: array
              minItems: 1
              maxItems: 64
              items: {$ref: '#/components/schemas/MarketSelector'}
            exchange: {type: string, minLength: 1}
            market_type: {type: string, minLength: 1}
            asset_type: {type: string, minLength: 1}
            dynamic: {type: boolean, default: false}
            params: {type: object, additionalProperties: true}
    ReleaseOwnerRequest:
      $ref: '#/components/schemas/CommandEnvelope'
    RecoverMarketRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          properties:
            source_ids:
              type: array
              items: {type: string, minLength: 1}
    CommandAccepted:
      type: object
      required: [command_id, status]
      properties:
        command_id: {type: string, minLength: 1}
        status: {const: accepted}
        operation: {type: string, minLength: 1}
        subscription_id: {type: string, minLength: 1}
        subscription_status: {type: string, minLength: 1}
    CommandCompleted:
      type: object
      required: [command_id, status]
      properties:
        command_id: {type: string, minLength: 1}
        status: {const: completed}
        removed_subscription_ids:
          type: array
          items: {type: string, minLength: 1}
    SubscriptionStatus:
      type: object
      required: [subscription_id, owner_id, status]
      properties:
        subscription_id: {type: string, minLength: 1}
        owner_id: {type: string, minLength: 1}
        status:
          type: string
          enum: [pending, ready, degraded, rejected, removed]
        members: {type: array, items: {type: object, additionalProperties: true}}
        error: {type: string}
        updated_at_unix_nanos: {type: integer, minimum: 1}
    MarketHealth:
      allOf:
        - $ref: '../common/control.openapi.yaml#/components/schemas/HealthResponse'
        - type: object
          required: [generation]
          properties:
            generation: {type: integer, minimum: 0}
            event_stream_id: {type: string, minLength: 1}
            event_sequence: {type: integer, minimum: 0}
            sources: {type: array, items: {type: object, additionalProperties: true}}
    ErrorResponse:
      $ref: '../common/control.openapi.yaml#/components/schemas/ErrorResponse'

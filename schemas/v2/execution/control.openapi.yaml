openapi: 3.1.0
info:
  title: Kairos Execution Control API
  version: 2.0.0
  description: >-
    User-facing Execution commands over a workspace-scoped Unix domain socket
    carrying HTTP semantics. Responses describe command admission only;
    exchange acknowledgements and fills are published on the Execution event
    stream and reflected in active mmap views.
servers:
  - url: unix://{socket}
    variables:
      socket:
        default: execution.sock
tags:
  - name: routes
  - name: intents
  - name: orders
  - name: operations
  - name: health
paths:
  /v1/routes:
    get:
      tags: [routes]
      operationId: listExecutionRoutes
      summary: Query current Execution-owned order-entry route candidates
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: segment_key, in: query, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - {name: market_id, in: query, schema: {type: string}}
        - {name: order_type, in: query, schema: {type: string, enum: [market, limit]}}
        - {name: options, in: query, description: Comma-separated required option names, schema: {type: string}}
      responses:
        '200':
          description: Current routes composed from canonical identity, configured connections and readiness.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes: {type: array, items: {$ref: '#/components/schemas/ExecutionRouteCandidate'}}

  /v1/intents:
    post:
      tags: [intents]
      operationId: submitExecutionIntent
      summary: Submit an execution intent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitIntentRequest'}
      responses:
        '202':
          description: The intent was accepted for asynchronous execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/CommandRejected'}
        '503': {$ref: '#/components/responses/ControlUnavailable'}

  /v1/orders:
    post:
      tags: [orders]
      operationId: submitExecutionOrder
      summary: Submit one execution-owned order command
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitOrderRequest'}
      responses:
        '202':
          description: The order command was accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/CommandRejected'}
        '503': {$ref: '#/components/responses/ControlUnavailable'}

  /v1/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    delete:
      tags: [orders]
      operationId: cancelExecutionOrder
      summary: Request cancellation of an active order
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CallerId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelOrderRequest'}
      responses:
        '202':
          description: The cancellation request was accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/CommandRejected'}
    patch:
      tags: [orders]
      operationId: replaceExecutionOrder
      summary: Request replacement of an active order
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CallerId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceOrderRequest'}
      responses:
        '202':
          description: The replacement request was accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/CommandRejected'}

  /v1/reconciliation:
    post:
      tags: [operations]
      operationId: reconcileExecution
      summary: Request reconciliation of execution state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconcileExecutionRequest'}
      responses:
        '202':
          description: Reconciliation was accepted for asynchronous processing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '422': {$ref: '#/components/responses/CommandRejected'}

  /v1/health:
    get:
      tags: [health]
      operationId: getExecutionHealth
      summary: Read Execution process health
      responses:
        '200':
          description: Execution operational health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionHealth'}

components:
  parameters:
    CommandId:
      $ref: '../common/control.openapi.yaml#/components/parameters/CommandId'
    IdempotencyKey:
      $ref: '../common/control.openapi.yaml#/components/parameters/IdempotencyKey'
    CallerId:
      $ref: '../common/control.openapi.yaml#/components/parameters/CallerId'
    WorkspaceId:
      $ref: '../common/control.openapi.yaml#/components/parameters/WorkspaceId'
    OrderId:
      name: order_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    IdempotencyConflict:
      $ref: '../common/control.openapi.yaml#/components/responses/IdempotencyConflict'
    CommandRejected:
      $ref: '../common/control.openapi.yaml#/components/responses/CommandRejected'
    ControlUnavailable:
      $ref: '../common/control.openapi.yaml#/components/responses/ControlUnavailable'
    NotFound:
      $ref: '../common/control.openapi.yaml#/components/responses/NotFound'
  schemas:
    ExecutionRouteCandidate:
      type: object
      required: [route_id, participant_id, provider_product, provider_symbol, supported_order_types, supported_options, ready]
      properties:
        route_id: {type: string}
        account_id: {type: [string, 'null']}
        segment_key: {type: [string, 'null']}
        instrument_id: {type: [string, 'null']}
        market_id: {type: [string, 'null']}
        participant_id: {type: string}
        provider_product: {type: string}
        provider_symbol: {type: string}
        supported_order_types: {type: array, items: {type: string, enum: [Market, Limit]}}
        supported_options: {type: array, items: {type: string}}
        ready: {type: boolean}
    CommandEnvelope:
      $ref: '../common/control.openapi.yaml#/components/schemas/CommandEnvelope'
    SubmitIntentRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          required: [intent]
          properties:
            intent: {$ref: '#/components/schemas/ExecutionIntent'}
    ExecutionIntent:
      type: object
      required: [intent_id, strategy_id, instance_id, legs]
      properties:
        intent_id: {type: string, minLength: 1}
        strategy_id: {type: string, minLength: 1}
        launch_id: {type: string, minLength: 1}
        instance_id: {type: string, minLength: 1}
        intent_type: {type: string, minLength: 1}
        completion_policy: {type: string, minLength: 1}
        failure_policy: {type: string, minLength: 1}
        deadline_unix_nanos: {type: integer, minimum: 1}
        legs:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/IntentLeg'}
        evidence:
          type: array
          items: {type: object, additionalProperties: true}
    IntentLeg:
      type: object
      required: [leg_id, account_id, instrument_id, market_id, execution_route_id, side, quantity]
      properties:
        leg_id: {type: string, minLength: 1}
        account_id: {type: string, minLength: 1}
        segment_key: {type: string, minLength: 1}
        instrument_id: {type: string, minLength: 1}
        market_id: {type: string, minLength: 1}
        execution_route_id: {type: string, minLength: 1}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: string, minLength: 1}
        quantity_semantics: {type: string, minLength: 1}
        limit_price: {type: string, minLength: 1}
        options: {type: object, additionalProperties: true}
    SubmitOrderRequest:
      type: object
      required: [order_id, account_id, segment_key, instrument_id, execution_route_id, side, order_type, quantity]
      properties:
        order_id: {type: string, minLength: 1}
        intent_id: {type: string, minLength: 1}
        account_id: {type: string, minLength: 1}
        segment_key: {type: string, minLength: 1}
        instrument_id: {type: string, minLength: 1}
        market_id: {type: string, minLength: 1}
        execution_route_id: {type: string, minLength: 1}
        side: {type: string, enum: [Buy, Sell, buy, sell]}
        order_type: {type: string, enum: [Market, Limit, market, limit]}
        quantity: {type: string, minLength: 1}
        limit_price: {type: string, minLength: 1}
        options: {type: object, additionalProperties: true}
    CancelOrderRequest:
      type: object
      properties:
        reason: {type: string}
    ReplaceOrderRequest:
      type: object
      minProperties: 1
      properties:
        quantity: {type: string, minLength: 1}
        limit_price: {type: string, minLength: 1}
        options: {type: object, additionalProperties: true}
        reason: {type: string}
    ReconcileExecutionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandEnvelope'
        - type: object
          properties:
            account_id: {type: string, minLength: 1}
            execution_route_id: {type: string, minLength: 1}
            order_id: {type: string, minLength: 1}
            reason: {type: string}
    CommandAccepted:
      $ref: '../common/control.openapi.yaml#/components/schemas/CommandAccepted'
    ExecutionHealth:
      allOf:
        - $ref: '../common/control.openapi.yaml#/components/schemas/HealthResponse'
        - type: object
          properties:
            active_intents: {type: integer, minimum: 0}
            active_orders: {type: integer, minimum: 0}
    ErrorResponse:
      $ref: '../common/control.openapi.yaml#/components/schemas/ErrorResponse'

# Offline replay launch for Binance Spot BTCUSDT quote data.

[launch]
id = "binance-btcusdt-quote-backtest"
mode = "backtest"
strategy = "examples.backtest.quote_strategy:BtcusdtQuoteStrategy"

[accounts.paper]
ref = "paper-account"
enabled = true

[backtest]
data_root = ".kairos/data"
storage_format = "jsonl"

[backtest.market]
scope = "instance"
profile = "replay"
events = "../examples/backtest/data/binance-btcusdt-quotes.jsonl"
start = "2024-01-01T00:00:00Z"
end = "2024-01-01T00:01:00Z"

[execution]
enabled = true
provider = "simulated"
product = "spot"

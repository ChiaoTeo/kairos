# Offline replay launch for Massive SPY hourly bars.

[launch]
id = "massive-spy-hourly-bar-backtest"
mode = "backtest"
strategy = "examples.backtest.hourly_bar_strategy:SpyHourlyBarStrategy"

[accounts.paper]
ref = "paper-account"
enabled = true

[backtest]
data_root = ".kairos/data"
storage_format = "jsonl"

[backtest.market]
scope = "instance"
profile = "replay"
events = "../examples/backtest/data/massive-spy-1h.jsonl"
start = "2024-01-01T13:00:00Z"
end = "2024-01-01T16:00:00Z"

[execution]
enabled = true

[[execution.routes]]
route_id = "paper-account-equity"
account_id = "paper-account"
segment_key = "equity"
broker_id = "simulated"
execution_channel = "equity"

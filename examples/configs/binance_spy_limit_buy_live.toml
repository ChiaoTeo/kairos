[launch]
id = "example-binance-spy-limit-buy-live"
mode = "live"
strategy = "examples.strategies.binance_spy_limit_buy_live:strategy"

[strategy.params]
account = "binance_zhaoqian888666"
segment = "spot"
symbol = "SPY"
quantity = "1"
limit_price = "750"

[live.safety]
# This example intentionally enables live order submission.
trading_enabled = true
require_limit_orders = true
max_order_notional = "750"

[account]
ref = "binance_zhaoqian888666"

[accounts.main]
ref = "binance_zhaoqian888666"
segments = ["spot"]
trade = true

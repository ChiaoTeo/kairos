[launch]
id = "news-factor-backtest"
mode = "backtest"

[paths]
launches_root = ".kairos/launches"

[backtest]
start = "2026-01-01T00:00:00+00:00"
end = "2026-01-01T00:10:00+00:00"

[params]
news_path = "examples/data/news_factor.csv"
sentiment_threshold = 0.65
symbol = "BTC/USDT"
instrument_id = "instrument:spot:btc:usdt"
market_id = "market:binance:spot:btc_usdt"
target_quantity = "1"

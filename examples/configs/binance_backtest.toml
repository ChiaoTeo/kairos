[run]
id = "binance-btc-sma-backtest"
mode = "backtest"
strategy = "examples.strategies.sma:SmaCrossBacktest"

[strategy.params]
symbol = "BTC/USDT"
quantity = "0.01"
fast_window = 20
slow_window = 50
venue = "binance"
market = "spot"
timeframe = "1m"

[backtest]
data_root = "../.kairos/data"
runs_root = "../.kairos/runs"
storage_format = "jsonl"
venue = "binance"
market = "spot"
price_field = "close"

[account]
cash = "10000"
currency = "USDT"
fee_rate = "0.001"

[execution]
slippage_bps = "1"

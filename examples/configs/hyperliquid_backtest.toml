[run]
id = "hyperliquid-sma-backtest"
mode = "backtest"
strategy = "examples.strategies.sma:SmaCrossBacktest"

[strategy.params]
symbol = "BTC/USDC:USDC"
quantity = "0.01"
fast_window = 3
slow_window = 5
venue = "hyperliquid"
market = "swap"
timeframe = "1m"

[backtest]
data_root = "../.kairos/data"
runs_root = "../.kairos/runs"
storage_format = "jsonl"
venue = "hyperliquid"
market = "swap"
price_field = "close"

[account]
cash = "10000"
currency = "USDC"
fee_rate = "0.0004"

[execution]
slippage_bps = "1"
